name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  STAGING_IMAGE: ghcr.io/${{ github.repository }}-staging

jobs:
  # ---------- ЛР1: линт, unit-тесты, сборка ----------
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: python -m flake8 app tests

      - name: Unit tests with coverage (Quality Gate 80%)
        run: |
          python -m pytest tests/test_app.py -o addopts="" \
            --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Build (syntax check)
        run: python -m py_compile app/*.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ---------- ЛР3: интеграционные тесты с Testcontainers ----------
  integration:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Integration tests (PostgreSQL + Redis, parallel)
        run: python -m pytest tests/integration -o addopts="" -q -n 4

  # ---------- ЛР2: сборка, сканирование, публикация ----------
  build-and-scan:
    needs: [ lint-and-unit, integration ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image with layer caching
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ci-lab-1:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy full report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-lab-1:${{ env.SHORT_SHA }}
          format: table
          output: trivy-report.txt
          scanners: vuln

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Trivy Quality Gate (HIGH, CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-lab-1:${{ env.SHORT_SHA }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-lab-1:${{ env.SHORT_SHA }}
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: ignore

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_ID=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag ci-lab-1:${SHORT_SHA} "$IMAGE_ID:${SHORT_SHA}"
          docker tag ci-lab-1:${SHORT_SHA} "$IMAGE_ID:${{ github.run_number }}"
          docker push "$IMAGE_ID:${SHORT_SHA}"
          docker push "$IMAGE_ID:${{ github.run_number }}"

  # ---------- ЛР3: продвижение образа в staging без пересборки ----------
  promote:
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to staging (no rebuild)
        run: |
          SOURCE=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TARGET=$(echo "$STAGING_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t "$TARGET:${SHORT_SHA}" \
            -t "$TARGET:${{ github.run_number }}" \
            "$SOURCE:${SHORT_SHA}"

  # ---------- ЛР3: GitOps-обновление манифеста ----------
  gitops:
    needs: promote
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Update staging manifest
        run: |
          STAGING=$(echo "$STAGING_IMAGE" | tr '[:upper:]' '[:lower:]')
          sed -i -E "s|image: .*ci-lab-1-staging:.*|image: $STAGING:${SHORT_SHA}|" \
            k8s-manifests/staging/deployment.yaml

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/staging/deployment.yaml
          git diff --cached --quiet || git commit -m "chore(staging): promote ${SHORT_SHA}"
          git push
